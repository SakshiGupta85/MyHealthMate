<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | My Health Mate</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        My Health Mate
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>

</header>


<section class="section">

    <div class="form-container">

        <span class="tag">
            WELCOME BACK
        </span>

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="primary-btn">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

</section>


<script src="js/login.js"></script>

</body>

</html>
