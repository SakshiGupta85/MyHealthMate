<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | My Health Mate</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        My Health Mate
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<section class="section">

    <div class="form-container">

        <span class="tag">
            BEGIN YOUR JOURNEY
        </span>

        <h2>Create Your Account</h2>

        <p>
            Your personal health-productivity space.
        </p>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="primary-btn">
                Create Account
            </button>

        </form>

        <p id="message"></p>

    </div>

</section>


<script src="js/register.js"></script>

</body>

</html>
