<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | My Health Mate</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        My Health Mate
    </div>

    <nav>

        <span id="welcomeUser"></span>

        <a href="#" id="logout">
            Logout
        </a>

    </nav>

</header>


<section class="section">

    <span class="tag">
        DAILY BALANCE LAB
    </span>

    <h2>How is your day looking?</h2>

    <p class="section-intro">
        Answer a few questions and let My Health Mate
        build today's health-productivity strategy.
    </p>


    <div class="form-container">

        <form id="checkinForm">

            <label>
                Sleep Duration
            </label>

            <input
                type="number"
                id="sleep_hours"
                min="0"
                max="14"
                step="0.5"
                placeholder="Hours slept"
                required
            >


            <label>
                Sleep Quality
            </label>

            <select id="sleep_quality">

                <option value="1">Very Poor</option>
                <option value="2">Poor</option>
                <option value="3">Average</option>
                <option value="4">Good</option>
                <option value="5">Excellent</option>

            </select>


            <label>
                Current Energy
            </label>

            <select id="energy_level">

                <option value="1">Very Low</option>
                <option value="2">Low</option>
                <option value="3">Moderate</option>
                <option value="4">High</option>
                <option value="5">Very High</option>

            </select>


            <label>
                Current Stress
            </label>

            <select id="stress_level">

                <option value="1">Very Low</option>
                <option value="2">Low</option>
                <option value="3">Moderate</option>
                <option value="4">High</option>
                <option value="5">Very High</option>

            </select>


            <label>
                Hydration Today
            </label>

            <select id="hydration_level">

                <option value="1">Very Poor</option>
                <option value="2">Poor</option>
                <option value="3">Average</option>
                <option value="4">Good</option>
                <option value="5">Excellent</option>

            </select>


            <label>
                Meal Regularity
            </label>

            <select id="meal_regular">

                <option value="1">Very Irregular</option>
                <option value="2">Irregular</option>
                <option value="3">Average</option>
                <option value="4">Regular</option>
                <option value="5">Very Regular</option>

            </select>


            <label>
                Screen Load
            </label>

            <select id="screen_load">

                <option value="1">Very Low</option>
                <option value="2">Low</option>
                <option value="3">Moderate</option>
                <option value="4">High</option>
                <option value="5">Very High</option>

            </select>


            <label>
                Mentally Demanding Tasks
            </label>

            <input
                type="number"
                id="demanding_tasks"
                min="0"
                max="15"
                value="2"
                required
            >


            <button type="submit"
                    class="primary-btn">

                Analyze My Day

            </button>

        </form>

    </div>


    <div id="result"
         class="result-card"
         style="display:none;">

        <span class="tag">
            YOUR DAILY RESULT
        </span>

        <h2 id="status"></h2>

        <div class="score">
            <span id="score">0</span>
            <small>/ 100</small>
        </div>

        <p id="recommendation"></p>

    </div>


</section>


<script src="js/dashboard.js"></script>

</body>

</html>
